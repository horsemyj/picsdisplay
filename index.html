<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片下载站</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #8b5cf6;
        --accent-2: #3b82f6;
        --danger: #fca5a5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020817, #0f172a);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }
      .panel {
        width: min(520px, 92vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      }
      h1 { margin: 0 0 20px; text-align: center; }
      label {
        display: block;
        margin-bottom: 16px;
        font-size: 14px;
        color: var(--muted);
      }
      input {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #020817;
        color: white;
        font-size: 16px;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
      }
      .error {
        min-height: 20px;
        margin-top: 12px;
        color: var(--danger);
      }
      #galleryView {
        display: none;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 18px;
        margin-top: 18px;
      }
      .card {
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
      }
      .card img {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: cover;
        background: #111827;
      }
      .card .meta {
        padding: 12px 14px 14px;
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 14px;
        line-height: 1.4;
        color: #e2e8f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card a {
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 600;
      }
      .loading {
        color: var(--muted);
        text-align: center;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <div id="loginView" class="panel">
      <h1>图片下载站</h1>

      <form id="loginForm">
        <label>
          用户名
          <input id="username" name="username" type="text" placeholder="请输入用户名" required />
        </label>

        <label>
          密码
          <input id="password" name="password" type="password" placeholder="请输入密码" required />
        </label>

        <button type="submit">登录</button>

        <div id="loginMessage" class="error" aria-live="polite"></div>
      </form>
    </div>

    <div id="galleryView" class="panel">
      <h1>图片列表</h1>
      <div id="gallery" class="gallery"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
